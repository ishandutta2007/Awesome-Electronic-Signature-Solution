<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="sealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5" />
      <circle cx="40" cy="40" r="1" fill="#334155" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg-grid { opacity: 0.7; }
    
    /* Dynamic pulsing orbs in background */
    .orb-purple {
      animation: pulsePurple 7s ease-in-out infinite alternate;
    }
    .orb-cyan {
      animation: pulseCyan 9s ease-in-out infinite alternate;
    }
    
    /* Dynamic animated digital signature line */
    .sign-path {
      stroke-dasharray: 450;
      stroke-dashoffset: 450;
      animation: drawSign 5s ease-in-out infinite alternate;
    }
    
    /* Animated verification seal pulse */
    .verify-badge {
      animation: floatBadge 4s ease-in-out infinite alternate;
    }

    /* Flowing data lines */
    .stream-line {
      stroke-dasharray: 8 16;
      animation: streamFlow 20s linear infinite;
    }

    @keyframes pulsePurple {
      0% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      100% { transform: scale(1.25) translate(40px, -20px); opacity: 0.6; }
    }
    @keyframes pulseCyan {
      0% { transform: scale(1) translate(0px, 0px); opacity: 0.25; }
      100% { transform: scale(1.3) translate(-30px, 30px); opacity: 0.55; }
    }
    @keyframes drawSign {
      0% { stroke-dashoffset: 450; opacity: 0.3; }
      40% { opacity: 1; }
      80%, 100% { stroke-dashoffset: 0; opacity: 1; }
    }
    @keyframes floatBadge {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    @keyframes streamFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -500; }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" class="bg-grid" />

  <!-- Animated Background Glow Orbs -->
  <g filter="url(#glow)">
    <circle cx="980" cy="120" r="130" fill="#6366f1" class="orb-purple" />
    <circle cx="1100" cy="300" r="100" fill="#06b6d4" class="orb-cyan" />
    <circle cx="150" cy="350" r="110" fill="#8b5cf6" class="orb-purple" />
  </g>

  <!-- Decorative Flow Lines (Subtle in background) -->
  <path d="M -50 200 C 300 120, 600 320, 1250 180" fill="none" stroke="#4f46e5" stroke-width="1.5" stroke-opacity="0.3" class="stream-line" />
  <path d="M -50 250 C 350 350, 750 150, 1250 280" fill="none" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.25" class="stream-line" />

  <!-- Right Side Interactive Graphic / Verification Envelope Card (Background to text) -->
  <g transform="translate(820, 75)" class="verify-badge">
    <!-- Outer Card Frame -->
    <rect x="0" y="0" width="310" height="260" rx="20" fill="#0f172a" stroke="#334155" stroke-width="1.5" fill-opacity="0.85" filter="url(#glow)"/>
    <rect x="0" y="0" width="310" height="260" rx="20" fill="none" stroke="url(#primaryGrad)" stroke-width="1.5" stroke-opacity="0.7"/>

    <!-- Document Header Preview -->
    <rect x="25" y="25" width="40" height="40" rx="10" fill="#1e293b" />
    <path d="M 37 35 L 53 35 M 37 43 L 53 43 M 37 51 L 47 51" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    
    <text x="75" y="42" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Encrypted Envelope</text>
    <text x="75" y="58" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500">✓ Cryptographically Sealed</text>

    <!-- Simulated Document Content Lines -->
    <rect x="25" y="85" width="260" height="8" rx="4" fill="#1e293b" />
    <rect x="25" y="105" width="210" height="8" rx="4" fill="#1e293b" />
    <rect x="25" y="125" width="170" height="8" rx="4" fill="#1e293b" />

    <!-- Signature Pad Box -->
    <rect x="25" y="150" width="260" height="80" rx="12" fill="#131e33" stroke="#2563eb" stroke-width="1" stroke-dasharray="4 4" />
    <text x="35" y="168" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500">DIGITAL SIGNATURE (PAdES / PKCS#7)</text>

    <!-- Dynamic Animated Signature Curve -->
    <path class="sign-path" d="M 45 200 Q 70 165, 95 195 T 140 185 T 180 205 Q 210 170, 240 190 T 265 195" fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Validated Stamp / Badge -->
    <g transform="translate(230, 25)">
      <circle cx="15" cy="15" r="16" fill="url(#sealGrad)"/>
      <path d="M 9 15 L 14 20 L 22 10" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Foreground Main Title & Content (Ensured Clear & Unobstructed) -->
  <!-- Category Pill / Tag -->
  <g transform="translate(70, 65)">
    <rect x="0" y="0" width="270" height="32" rx="16" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1.2"/>
    <circle cx="16" cy="16" r="4" fill="#22c55e" />
    <text x="28" y="21" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">CURATED DEVELOPER ECOSYSTEM</text>
  </g>

  <!-- Primary Headline -->
  <text x="70" y="145" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
    Awesome Electronic Signature
  </text>
  
  <text x="70" y="195" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
    Solutions &amp; Open-Source Tools
  </text>

  <!-- Subtitle / Tagline -->
  <text x="70" y="245" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400">
    The ultimate curated collection of enterprise SaaS platforms, self-hosted e-signature engines,
  </text>
  <text x="70" y="272" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400">
    tamper-evident audit trails, and cryptographic PDF digital signing libraries.
  </text>

  <!-- Feature Highlights / Pills -->
  <g transform="translate(70, 315)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="135" height="34" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="14" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">✍️ Self-Hosted</text>

    <!-- Pill 2 -->
    <rect x="145" y="0" width="170" height="34" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="160" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🛡️ Tamper-Evident</text>

    <!-- Pill 3 -->
    <rect x="325" y="0" width="180" height="34" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="340" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">⚡ DocuSign Alts</text>

    <!-- Pill 4 -->
    <rect x="515" y="0" width="155" height="34" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="530" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">📜 Audit Trails</text>
  </g>
</svg>
